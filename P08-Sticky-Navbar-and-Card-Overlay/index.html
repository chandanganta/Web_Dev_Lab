<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navbar and Card Overlay</title>
  
</head>
<body>
  <nav><a href="#home">Home</a><a href="#about">About</a><a href="#work">Work</a></nav>
  <main id="home">
    <h1>Positioning in CSS</h1>
    <p>Scroll the page to see the navigation bar remain at the top.</p>
    <section class="card" id="about">
      <h2>About This Card</h2><p>The card uses relative positioning as the reference for its overlay.</p>
      <div class="overlay">Card overlay</div>
    </section>
    <section class="card" id="work"><h2>More Content</h2><p>This section helps demonstrate the sticky navbar while scrolling.</p></section>
  </main>
</body>
</html>
